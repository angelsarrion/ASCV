<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="synthGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#ff70a6"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#70d6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Dark Synth Base Hexagon/Shield -->
  <polygon points="100,10 180,55 180,145 100,190 20,145 20,55" 
           fill="#0c0e1d" stroke="url(#synthGrad)" stroke-width="3.5" filter="url(#glow)"/>
           
  <!-- Inner Horizon Grid Lines -->
  <line x1="45" y1="120" x2="155" y2="120" stroke="#00f0ff" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="35" y1="135" x2="165" y2="135" stroke="#ff2a85" stroke-width="1" stroke-opacity="0.3"/>
  <line x1="30" y1="148" x2="170" y2="148" stroke="#8b5cf6" stroke-width="0.8" stroke-opacity="0.3"/>
  
  <!-- Monogram ÁS -->
  <g font-family="Latin Modern Roman, Georgia, serif" font-weight="900" text-anchor="middle" dominant-baseline="central">
    <text x="100" y="96" font-size="64" fill="url(#synthGrad)" filter="url(#glow)" letter-spacing="2">ÁS</text>
  </g>
  
  <!-- Sub-label -->
  <text x="100" y="165" font-family="Courier New, monospace" font-size="10" font-weight="bold" fill="#00f0ff" text-anchor="middle" letter-spacing="4">LEAD • IT</text>
</svg>