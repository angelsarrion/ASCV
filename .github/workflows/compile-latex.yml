name: Compile LaTeX to PDF

on:
  push:
    branches: [ main ]
    paths:
      - 'main.tex'
      - 'main-es.tex'
      - '.github/workflows/compile-latex.yml'
  workflow_dispatch:

concurrency:
  group: compile-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile English LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          args: -pdf -interaction=nonstopmode

      - name: Compile Spanish LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main-es.tex
          args: -pdf -interaction=nonstopmode

      - name: Update docs directory with generated PDFs
        run: |
          mkdir -p docs
          cp -f main.pdf docs/AngelSarrion-CV.pdf
          cp -f main-es.pdf docs/AngelSarrion-CV-es.pdf

      - name: Commit and push updated PDFs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs(cv): auto-compile LaTeX to PDF [skip ci]"
          file_pattern: "docs/*.pdf"
